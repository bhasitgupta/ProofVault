version: '3.8'

networks:
  sdms-fabric:
    name: sdms-fabric

services:
  orderer.sdms.gov.in:
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
    ports:
      - "7050:7050"
    networks:
      - sdms-fabric

  peer0.police.sdms.gov.in:
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_ID=peer0.police.sdms.gov.in
      - CORE_PEER_ADDRESS=peer0.police.sdms.gov.in:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_LOCALMSPID=PoliceMSP
    ports:
      - "7051:7051"
    networks:
      - sdms-fabric

  peer0.forensics.sdms.gov.in:
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_ID=peer0.forensics.sdms.gov.in
      - CORE_PEER_ADDRESS=peer0.forensics.sdms.gov.in:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_LOCALMSPID=ForensicsMSP
    ports:
      - "8051:8051"
    networks:
      - sdms-fabric
