[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdms-backend"
version = "0.1.0"
description = "Secure Digital Document Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "cryptography",
    "pyjwt",
    "pyotp",
    "qrcode",
    "sqlalchemy",
    "aiosqlite",
    "structlog",
    "reportlab",
    "jinja2",
    "pymupdf",
    "pydantic-settings",
    "python-multipart"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
